name: ZuckMode
options:
  bundleIdPrefix: com.petar
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.petar.ZuckMode
    MACOSX_DEPLOYMENT_TARGET: 13.0
    SWIFT_VERSION: 5.9
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO

targets:
  ZuckMode:
    type: application
    platform: macOS
    sources:
      - path: Sources/ZuckMode
    info:
      path: ZuckMode/Info.plist
      properties:
        NSPrincipalClass: NSApplication
        LSUIElement: YES
        NSCameraUsageDescription: "ZuckMode monitors your smile intensity. No smile = no screen. Mark is watching."
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
